    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google Fonts with &display=swap to prevent render-blocking FOIT/FOUT -->

      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;700;800;900&display=swap"

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;700;800;900&display=swap"
      />
    </noscript>

    <!-- Critical Performance: High-Priority LCP Image Preload for Google Ads & PageSpeed Insights -->

      rel="preload"
      as="image"

                  </span>
