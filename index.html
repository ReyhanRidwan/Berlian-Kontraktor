    <!-- Performance: Preconnect & DNS-Prefetch to Cloudinary CDN for instant connection -->

    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Performance: Preconnect & DNS-Prefetch to Google Fonts for instant DNS & TLS handshake -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Google Fonts with &display=swap to prevent render-blocking FOIT/FOUT -->

      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;700;800;900&display=swap"
    />

    />
